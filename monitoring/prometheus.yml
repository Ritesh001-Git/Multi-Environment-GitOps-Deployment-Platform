global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'gitops-platform'
    environment: 'production'

# ── Alerting ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ── Rule files ───────────────────────────────────────────────────────────
rule_files:
  - 'rules/alerts.yml'

# ── Scrape configs ────────────────────────────────────────────────────────
scrape_configs:

  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Jenkins — build metrics via Prometheus plugin
  #    Requires: Jenkins Prometheus plugin installed (Step 1)
  - job_name: 'jenkins'
    metrics_path: '/prometheus/'
    static_configs:
      - targets: ['JENKINS_EC2_PRIVATE_IP:8080']
        labels:
          instance: 'jenkins-master'
          service: 'jenkins'

  # 3. FastAPI backend — HTTP + custom deployment metrics
  #    Requires: prometheus-fastapi-instrumentator + metrics.py (Step 3)
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['APP_EC2_PRIVATE_IP:8000']
        labels:
          instance: 'app-ec2'
          service: 'fastapi'

  # 4. Node Exporter — Jenkins EC2 system metrics
  - job_name: 'node-jenkins-ec2'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: 'jenkins-ec2'
          role: 'jenkins'

  # 5. Node Exporter — App EC2 system metrics
  - job_name: 'node-app-ec2'
    static_configs:
      - targets: ['APP_EC2_PRIVATE_IP:9100']
        labels:
          instance: 'app-ec2'
          role: 'app'

  # 6. cAdvisor — Docker containers on Jenkins EC2
  - job_name: 'cadvisor-jenkins-ec2'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'jenkins-ec2'
          role: 'jenkins'

  # 7. cAdvisor — Docker containers on App EC2
  - job_name: 'cadvisor-app-ec2'
    static_configs:
      - targets: ['APP_EC2_PRIVATE_IP:8081']
        labels:
          instance: 'app-ec2'
          role: 'app'

  # 8. Alertmanager self-monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
