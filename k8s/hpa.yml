apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gitops-app-hpa
  namespace: gitops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gitops-app

  # Keep one replica while using SQLite. Raise this only after configuring a
  # shared PostgreSQL DATABASE_URL and an external deployment task worker.
  minReplicas: 1
  maxReplicas: 1

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # scale up when CPU > 70%

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
