apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-app
  namespace: gitops

  labels:
    app: gitops-app
    app.kubernetes.io/name: gitops-app
    app.kubernetes.io/part-of: gitops-platform

spec:
  # SQLite uses one writer on a persistent volume. Use PostgreSQL before scaling.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    # Prevent overlapping API pods from resuming the same in-process pipeline.
    # Switch to RollingUpdate only with PostgreSQL + a durable external worker.
    type: Recreate

  selector:
    matchLabels:
      app: gitops-app

  template:

    metadata:
      labels:
        app: gitops-app
        app.kubernetes.io/name: gitops-app
        app.kubernetes.io/part-of: gitops-platform

    spec:
      serviceAccountName: gitops-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:

        - name: app

          image: ritesh1973/gitops-platform:test

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: gitops-backend-env

          env:
            - name: ENVIRONMENT
              value: "local-k8s"
            - name: KUBE_MODE
              value: "in-cluster"
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////data/gitops.db"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "300m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitops-data
        - name: tmp
          emptyDir: {}
