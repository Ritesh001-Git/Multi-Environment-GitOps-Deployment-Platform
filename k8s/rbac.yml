# Scoped permissions for the Jenkins pipeline to deploy into the gitops namespace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-platform
  namespace: gitops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-platform-reader
  namespace: gitops
rules:
  - apiGroups: [""]
    resources:
      - services
      - pods
      - pods/log
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-platform-reader
  namespace: gitops
subjects:
  - kind: ServiceAccount
    name: gitops-platform
    namespace: gitops
roleRef:
  kind: Role
  name: gitops-platform-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-platform-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-platform-namespace-reader
subjects:
  - kind: ServiceAccount
    name: gitops-platform
    namespace: gitops
roleRef:
  kind: ClusterRole
  name: gitops-platform-namespace-reader
  apiGroup: rbac.authorization.k8s.io
